apiVersion: tokenyard/v1
kind: Policy
metadata: { name: fixture }
pricing: ./prices.yaml
keys: ./keys.yaml
providers:
  pt: { format: anthropic, baseUrl: https://proxy.example.com, credential: passthrough }
tenants:
  acme: { teams: [web] }
routes:
  - { name: all, match: {}, chain: [pt] }
budgets:
  - { name: org-month, scope: tenant, window: month, usd: 100, onExceed: block }
failure:
  counterStoreDown: { rateLimits: open, budgets: closed }
