apiVersion: tokenyard/v1
kind: Policy
metadata: { name: fixture }
pricing: ./prices.yaml
keys: ./keys.yaml
providers:
  anthropic: { format: anthropic, baseUrl: https://api.anthropic.com, credential: { env: ANTHROPIC_API_KEY } }
tenants:
  acme: { teams: [web] }
routes:
  # code_execution has no price: with an enforced budget, allow-and-flag cannot admit it.
  - { name: all, match: {}, chain: [anthropic], serverTools: [code_execution] }
budgets:
  - { name: org-month, scope: tenant, window: month, usd: 100, onExceed: block }
failure:
  counterStoreDown: { rateLimits: open, budgets: closed }
  unpricedModel: allow-and-flag
