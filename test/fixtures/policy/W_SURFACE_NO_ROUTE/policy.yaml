apiVersion: tokenyard/v1
kind: Policy
metadata: { name: fixture }
pricing: ./prices.yaml
keys: ./keys.yaml
providers:
  anthropic: { format: anthropic, baseUrl: https://api.anthropic.com, credential: { env: ANTHROPIC_API_KEY } }
tenants:
  acme: { teams: [web] }
routes:
  - { name: a, match: { surface: anthropic-messages }, chain: [anthropic] }
  - { name: b, match: { surface: anthropic-count-tokens }, chain: [anthropic] }
  - { name: c, match: { surface: openai-responses }, chain: [anthropic] }
budgets:
  - { name: org-month, scope: tenant, window: month, usd: 100, onExceed: block }
failure:
  counterStoreDown: { rateLimits: open, budgets: closed }
