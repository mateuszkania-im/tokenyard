apiVersion: tokenyard/v1
kind: Policy
metadata: { name: fixture }
pricing: ./prices.yaml
keys: ./keys.yaml
providers:
  anthropic: { format: anthropic, baseUrl: https://api.anthropic.com, credential: { env: ANTHROPIC_API_KEY } }
  oa: { format: openai, baseUrl: https://api.openai.com/v1, credential: { env: OPENAI_API_KEY } }
tenants:
  acme: { teams: [web] }
routes:
  - { name: cc, match: { surface: anthropic-messages, traffic: coding-agent }, chain: [oa] }
  - { name: rest, match: {}, chain: [anthropic] }
budgets:
  - { name: org-month, scope: tenant, window: month, usd: 100, onExceed: block }
failure:
  counterStoreDown: { rateLimits: open, budgets: closed }
