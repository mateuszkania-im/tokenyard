apiVersion: tokenyard/v1
kind: Policy
metadata: { name: fixture }
pricing: ./prices.yaml
keys: ./keys.yaml
providers:
  anthropic: { format: anthropic, baseUrl: https://api.anthropic.com, credential: { env: ANTHROPIC_API_KEY } }
tenants:
  acme: { teams: [web] }
routes:
  - { name: all, match: {}, chain: [anthropic] }
budgets:
  - { name: sess, scope: session, usd: 10, onExceed: block, mode: audit }
reservation:
  estimator: session-aware
failure:
  counterStoreDown: { rateLimits: open }
